@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');:root{--ink:#302432;--wine:#793b53;--gold:#bf9360;--line:#eee4e2}*{box-sizing:border-box}body{margin:0;background:#faf7f4;color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px}aside{position:fixed;inset:0 auto 0 0;background:#281c2d;color:#f3e7e8;width:220px;padding:24px 14px}aside .logo{font:32px 'Playfair Display';text-align:center;color:#ecd1ab;margin-bottom:30px}nav button{width:100%;display:block;text-align:left;background:none;color:#e9dee5;padding:12px 14px;margin:2px 0}nav button.on,nav button:hover{background:#ffffff23}main{margin-left:220px;padding:28px 35px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.sub{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.hero{border-radius:15px;background:linear-gradient(115deg,#513149,#803f59,#ad6877);color:white;padding:40px;position:relative;min-height:200px;overflow:hidden}.hero h1{font:52px 'Playfair Display';margin:10px 0}.hero p{color:#f4dce2}.hero .flowers{position:absolute;right:10%;top:5%;font:130px 'Playfair Display';opacity:.13}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:17px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}.card strong{display:block;font-size:28px;margin-top:9px}.muted{color:#8e7e87;font-size:12px}.panel{margin:16px 0}h2{font:26px 'Playfair Display'}h3{font:20px 'Playfair Display'}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:17px 0}.btn{background:var(--wine);color:white;padding:10px 15px}.btn.gray{background:#f4eeed;color:var(--ink)}input,select,textarea{padding:10px;border:1px solid #e4d7d8;border-radius:7px;background:white;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:12px 9px;text-align:left;border-bottom:1px solid #f1e9e6}th{color:#988a92;font-size:10px;text-transform:uppercase}td{max-width:220px;word-break:break-word}.table{overflow-x:auto}.tag{padding:4px 8px;background:#f4eded;border-radius:15px;white-space:nowrap}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.event{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.event .art{height:165px;background:linear-gradient(130deg,#e5d8d8,#eee0cc);display:grid;place-items:center;font:60px 'Playfair Display';color:#81596a}.event .info{padding:14px}dialog{border:0;border-radius:13px;padding:25px;width:min(620px,94vw);box-shadow:0 20px 90px #0004}dialog::backdrop{background:#27172688}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.fields label{display:grid;gap:5px;font-size:12px}.fields input,.fields select,.fields textarea{width:100%}.actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}#notice{position:fixed;bottom:20px;right:20px;background:#342538;color:#fff;padding:12px;border-radius:8px;display:none}@media(max-width:850px){aside{width:62px;padding:13px 5px}.logo{font-size:17px!important}nav button{font-size:0;text-align:center}nav button b{font-size:18px}main{margin-left:62px;padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.events{grid-template-columns:1fr}.hero h1{font-size:37px}}@media(max-width:500px){.fields{grid-template-columns:1fr}.hero{padding:25px}}
</style><aside><div class="logo">A & K</div><nav id="nav"></nav></aside><main><header><div><div class="sub">The Wedding Edit</div><b id="page">Overview</b></div><button class="btn gray" onclick="backup()">Export backup</button></header><section id="body"></section></main><dialog id="modal"><h2 id="modalTitle"></h2><form id="form"><div class="fields" id="fields"></div><div class="actions"><button type="button" class="btn gray" onclick="modal.close()">Cancel</button><button class="btn">Save record</button></div></form></dialog><div id="notice"></div><script>
const $=x=>document.getElementById(x),labels={dashboard:'Overview',departments:'Departments & POCs',tasks:'Task Tracker',events:'Events & Timeline',guests:'Guests & Rooms',vendors:'Vendors',payments:'Budget & Payments',issues:'Issue Desk',settings:'Settings & Sync'},icons=['◈','♙','☑','◷','♧','▤','₹','⚑','⚙'];const dn=['Invitations & RSVP','Guest Reception','Accommodation','Transportation','VIP & Elderly Care','Haldi & Mehendi','Sangeet & Entertainment','Wedding Rituals','Baraat & Procession','Bride & Groom Readiness','Venue Management','Decoration & Florals','Catering & Food','Photography & Video','Sound, Light & Technical','Vendor Coordination','Inventory & Gifts','Finance & Payments','Security & Valuables','Medical & Emergency','Parking & Traffic','Family Coordination','Communication & Announcements','Troubleshooting & Contingency'];const schema={departments:['name:Department','lead:POC Name','phone:Phone','backup:Backup POC','backupPhone:Backup Phone','status:Status=Unassigned|Assigned|Confirmed','notes:Notes'],tasks:['title:Task','department:Department','owner:Owner','due:Deadline','priority:Priority=Low|Medium|High|Critical','status:Status=Not Started|In Progress|Blocked|Completed','notes:Notes'],events:['name:Event','date:Date & time','venue:Venue','captain:Captain','phone:Phone','status:Status=Planning|Confirmed|Completed','notes:Notes'],guests:['name:Guest','phone:Phone','side:Side=Groom|Bride|Other','rsvp:RSVP=Pending|Confirmed|Declined','party:Party size','room:Room','arrival:Arrival','notes:Notes'],vendors:['name:Vendor','service:Service','contact:Contact','phone:Phone','amount:Contract ₹','paid:Paid ₹','status:Status=Enquiry|Booked|Confirmed|Completed','notes:Notes'],payments:['item:Expense','category:Category','vendor:Payee','amount:Amount ₹','paid:Paid ₹','due:Due date','status:Status=Pending|Partial|Paid'],issues:['title:Issue','department:Department','owner:Owner','severity:Severity=Low|Medium|High|Critical','status:Status=Open|In Progress|Blocked|Resolved','notes:Notes']};const seed={departments:dn.map((name,i)=>({id:'d'+i,name,status:'Unassigned'})),tasks:[],events:['Haldi','Sangeet','Shaadi'].map((name,i)=>({id:'e'+i,name,status:'Planning'})),guests:[],vendors:[],payments:[],issues:[]};let d;try{let x=JSON.parse(localStorage.getItem('akdata'));d=x&&Object.keys(seed).every(k=>Array.isArray(x[k]))?x:seed}catch{d=seed}let tab='dashboard',current=null;function safe(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(s){$('notice').textContent=s;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',2900)}function keep(){localStorage.setItem('akdata',JSON.stringify(d));draw()}function change(t){tab=t;draw()}function download(name,value,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([value],{type:type||'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('ankit-kajal-backup.json',JSON.stringify(d,null,2))}function csv(t){const rows=d[t],keys=[...new Set(['id',...rows.flatMap(x=>Object.keys(x))])],cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download(t+'.csv',[keys.join(','),...rows.map(x=>keys.map(k=>cell(x[k])).join(','))].join('\r\n'),'text/csv')}function add(t,id){current={t,id};const r=id?d[t].find(x=>x.id===id):{};$('modalTitle').textContent=(id?'Edit ':'Add ')+t;$('fields').innerHTML=schema[t].map(spec=>{let [key,rest]=spec.split(':'),[label,choices]=rest.split('=');let value=r[key]??'',type=key==='date'||key==='arrival'||key==='due'?'datetime-local':['amount','paid','party'].includes(key)?'number':'text';return '<label>'+safe(label)+(choices?'<select name="'+key+'">'+choices.split('|').map(opt=>'<option '+(value===opt?'selected':'')+'>'+safe(opt)+'</option>').join('')+'</select>':'<input name="'+key+'" type="'+type+'" value="'+safe(value)+'">')+'</label>'}).join('');$('modal').showModal()}$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),row={id:current.id||('x'+Date.now())};f.forEach((v,k)=>row[k]=v);if(current.id)d[current.t]=d[current.t].map(x=>x.id===current.id?row:x);else d[current.t].push(row);$('modal').close();keep();show('Record saved locally')};function del(t,id){if(confirm('Delete record?')){d[t]=d[t].filter(x=>x.id!==id);keep()}}function draw(){let ks=Object.keys(labels);$('nav').innerHTML=ks.map((k,i)=>'<button class="'+(k===tab?'on':'')+'" onclick="change(\''+k+'\')"><b>'+icons[i]+'</b> '+labels[k]+'</button>').join('');$('page').textContent=labels[tab];if(tab==='dashboard'){let done=d.tasks.filter(x=>x.status==='Completed').length,amt=x=>'₹'+x.toLocaleString('en-IN'),total=d.payments.reduce((s,x)=>s+Number(x.amount||0),0);$('body').innerHTML='<div class="hero"><div class="sub" style="color:#f1d3a5">A celebration of love</div><h1>Ankit & Kajal</h1><p>One beautiful wedding. One coordinated team.</p><div class="flowers">✿</div></div><div class="cards">'+[[d.departments.filter(x=>x.lead).length+'/24','Departments assigned'],[done+'/'+d.tasks.length,'Tasks complete'],[d.guests.filter(x=>x.rsvp==='Confirmed').length,'Confirmed guests'],[amt(total),'Planned expenses']].map(x=>'<div class="card"><span class="muted">'+x[1]+'</span><strong>'+x[0]+'</strong></div>').join('')+'</div><div class="panel"><h2>Our celebrations</h2><div class="events">'+['Haldi','Sangeet','Shaadi'].map((x,i)=>'<div class="event"><div class="art">'+['✿','♫','❀'][i]+'</div><div class="info"><h3>'+x+'</h3><p class="muted">'+safe(d.events.find(e=>e.name===x)?.date||'Date to be confirmed')+'</p><button class="btn gray" onclick="change(\'events\')">View event</button></div></div>').join('')+'</div></div><div class="panel"><h2>Next actions</h2><p class="muted">Assign department leads, add task deadlines and confirm your event captains.</p><button class="btn" onclick="change(\'departments\')">Assign POCs</button> <button class="btn gray" onclick="change(\'tasks\')">View tasks</button></div>';return}if(tab==='settings'){$('body').innerHTML='<h2>Settings & backup</h2><div class="panel"><h3>Data storage</h3><p>This hosted version saves records in this browser. To synchronize across devices with Google Sheets, use the downloadable full website and included Apps Script backend. Do not enter real guest contacts or financial data until your private cloud integration is configured.</p><button class="btn" onclick="backup()">Export JSON</button><p><input id="restore" type="file" accept=".json"></p><button class="btn gray" onclick="restore()">Restore JSON</button></div><div class="panel"><h3>Illustrations</h3><p>Use the included Haldi, Sangeet and Shaadi art assets in the downloadable project ZIP to complete the visual design.</p></div>';return}let rows=d[tab],keys=schema[tab].slice(0,6).map(x=>x.split(':')[0]);$('body').innerHTML='<div class="controls"><div><div class="sub">Wedding Operations</div><h2>'+labels[tab]+'</h2><span class="muted">'+rows.length+' records</span></div><div><button class="btn gray" onclick="csv(\''+tab+'\')">Export CSV</button> <button class="btn" onclick="add(\''+tab+'\')">+ Add record</button></div></div><div class="panel"><div class="table"><table><thead><tr>'+keys.map(k=>'<th>'+safe(k)+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+keys.map(k=>'<td>'+safe(r[k]||'—')+'</td>').join('')+'<td><button class="btn gray" onclick="add(\''+tab+'\',\''+r.id+'\')">Edit</button> <button class="btn gray" onclick="del(\''+tab+'\',\''+r.id+'\')">×</button></td></tr>').join(''):'<tr><td colspan="9">No records yet</td></tr>')+'</tbody></table></div></div>'}async function restore(){let f=$('restore').files[0];if(!f)return show('Select a file');try{let x=JSON.parse(await f.text());if(!Object.keys(seed).every(k=>Array.isArray(x[k])))throw Error('Invalid backup');if(confirm('Replace local data?')){d=x;keep()}}catch(e){show(e.message)}}draw();
</script></html>
